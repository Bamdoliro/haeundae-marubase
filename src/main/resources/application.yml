server:
  tomcat:
    # 전체 자기소개서 PDF 등 대용량 내보내기 응답이 오래 걸려도 연결이 끊기지 않도록 여유를 둔다.
    connection-timeout: 300000
    keep-alive-timeout: 120000

spring:
  profiles:
    active: local

  mvc:
    async:
      request-timeout: 300000

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        create_empty_composites:
          enabled: true

    generate-ddl: true
    hibernate:
      ddl-auto: update

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 무거운 내보내기 요청이 동시에 몰려도 커넥션 풀이 고갈되지 않도록 기본값(10)보다 늘린다.
      maximum-pool-size: 15
      connection-timeout: 30000

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  cloud:
    aws:
      s3:
        bucket: ${BUCKET_NAME}
      stack:
        auto: false
      region:
        static: ${S3_REGION}
      credentials:
        instance-profile: true
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}

  servlet:
    multipart:
      max-file-size: 10MB

  jasypt:
    encryptor:
      key: ${ENCRYPTION_PASSWORD}
      salt: ${ENCRYPTION_SALT}

jwt:
  refresh-expiration-time: 1296000000 # 15일
  access-expiration-time: 3600000 # 1시간
  prefix: Bearer
  secret-key: ${JWT_SECRET}

neis:
  key: ${NEIS_KEY}

message:
  api-key: ${MESSAGE_API_KEY}
  api-secret: ${MESSAGE_API_SECRET}
  api-domain: ${MESSAGE_API_DOMAIN}
  from: ${MESSAGE_FROM}

# 인증 쿠키의 Domain. 프론트엔드와 API가 함께 쓰는 상위 도메인이어야 한다.
domain:
  name: ${DOMAIN:hhsapply.com}

# allowCredentials(true)이므로 와일드카드(*) 금지. 쉼표로 구분한다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hhsapply.com,https://madmin.hhsapply.com,https://www.hhsapply.com,https://www.madmin.hhsapply.com}

---
spring:
  config:
    activate:
      on-profile: prod

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  mvc:
    static-path-pattern: /static/**
---
spring:
  config:
    activate:
      on-profile: dev

debug: false
---
spring:
  config:
    activate:
      on-profile: test

  jpa:
    properties:
      hibernate:
        format_sql: true

    generate-ddl: true
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test?MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=true;DATABASE_TO_UPPER=false;
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 6379
      password: bamdoliro


debug: false

