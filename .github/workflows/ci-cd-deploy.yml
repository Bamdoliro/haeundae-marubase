name: Deploy to AWS EC2

on:
  workflow_dispatch:

env:
  S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test -x asciidoctor

    - name: Make Directory
      run: mkdir -p deploy/scripts

    - name: Copy Jar
      run: cp ./build/libs/*.jar ./deploy

    - name: Copy appspec.yml
      run: cp appspec.yml ./deploy

    - name: Copy script
      run: cp ./scripts/*.sh ./deploy/scripts/

    - name: Make zip file
      run: cd deploy && zip -r ../haemaru.zip .
      shell: bash

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-northeast-2

    - name: Upload to S3
      run: aws s3 cp --region ap-northeast-2 ./haemaru.zip s3://$S3_BUCKET_NAME/

    - name: Cancle previous deployment if exists
      run: |
        DEPLOYMENT_ID=$(aws deploy list-deployments \
          --application-name haemaru \
          --deployment-group-name haemaru-deploy-group \
          --include-only-statuses InProgress \
          --query "deployments[0]" --output text \
          --region ap-northeast-2)

        if [ "$DEPLOYMENT_ID" != "None" ]; then
          echo "Stopping previous deployment: $DEPLOYMENT_ID"
          aws deploy stop-deployment --deployment-id $DEPLOYMENT_ID --region ap-northeast-2

          # stop-deployment는 비동기라 배포가 실제 종료 상태가 되어 슬롯이 풀릴 때까지 기다린다.
          MAX_ATTEMPTS=30
          INTERVAL_SECONDS=3
          for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(aws deploy get-deployment \
              --deployment-id $DEPLOYMENT_ID \
              --query "deploymentInfo.status" --output text \
              --region ap-northeast-2)
            echo "Previous deployment status: $STATUS ($ATTEMPT/$MAX_ATTEMPTS)"

            case "$STATUS" in
              Stopped|Succeeded|Failed)
                echo "Previous deployment finished: $STATUS"
                break
                ;;
            esac

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for previous deployment to stop (last status: $STATUS). Proceeding to deploy."
              break
            fi
            sleep $INTERVAL_SECONDS
          done
        else
          echo "No active deployment found"
        fi

    - name: Deploy
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        # 이전 배포가 아직 정리되지 않아 DeploymentLimitExceededException이 나면 잠시 기다렸다가 재시도한다.
        MAX_ATTEMPTS=3
        RETRY_DELAY_SECONDS=10
        for ATTEMPT in $(seq 1 $MAX_ATTEMPTS); do
          if OUTPUT=$(aws deploy create-deployment \
            --application-name haemaru \
            --deployment-group-name haemaru-deploy-group \
            --file-exists-behavior OVERWRITE \
            --s3-location bucket=$S3_BUCKET_NAME,bundleType=zip,key=haemaru.zip \
            --region ap-northeast-2 2>&1); then
            echo "$OUTPUT"
            exit 0
          fi

          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "DeploymentLimitExceededException" && [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
            echo "Active deployment still exists. Retrying in ${RETRY_DELAY_SECONDS}s ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep $RETRY_DELAY_SECONDS
          else
            exit 1
          fi
        done
